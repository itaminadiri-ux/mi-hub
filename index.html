<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreamHub Premium</title>
  <style>
    /* VARIABLES DE DISEÑO PREMIUM */
    :root {
      --bg-dark: #070a13; /* Fondo ultra oscuro profundo */
      --card-bg: rgba(30, 41, 59, 0.4); /* Fondo tarjeta efecto cristal */
      --card-border: rgba(255, 255, 255, 0.05); /* Borde casi invisible */
      --accent: #00e5ff; /* Azul neón vibrante sutil */
      --text-main: #f1f5f9; /* Blanco suave */
      --text-muted: #94a3b8; /* Gris azulado para títulos */
      --ease: cubic-bezier(0.23, 1, 0.32, 1); /* Animación suave Apple-style */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      -webkit-tap-highlight-color: transparent; /* Quita el flash azul al tocar en móvil */
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* TÍTULO PRINCIPAL ESTÉTICO */
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 35px;
      margin-top: 10px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    /* SECCIONES MINIMALISTAS */
    .section-container {
      width: 100%;
      max-width: 480px;
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
      padding-left: 5px;
    }

    /* GRID DE TARJETAS MODERNAS */
    .grid {
      display: grid;
      grid-template-columns: 1fr; /* Una columna por fila para estética horizontal */
      gap: 12px;
    }

    /* TARJETA PREMIUM CON EFECTO CRISTAL */
    .card {
      background-color: var(--card-bg);
      backdrop-filter: blur(10px); /* Efecto desenfoque de cristal */
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center; /* Alineación horizontal */
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.4s var(--ease);
      position: relative;
      overflow: hidden;
    }

    /* Brillo sutil superior en la tarjeta */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    /* Interacción al tocar (más sutil) */
    .card:active {
      transform: scale(0.97) translateY(1px);
      background-color: rgba(30, 41, 59, 0.6);
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* Iconos modernos y unificados */
    .card .icon-container {
      width: 45px;
      height: 45px;
      background-color: rgba(0, 229, 255, 0.1); /* Fondo icono muy suave */
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 18px;
      font-size: 1.4rem;
      color: var(--accent);
      flex-shrink: 0; /* Evita que el icono se encoja */
    }

    /* Estilo para el icono de Fútbol (Balón limpio) */
    .icon-ball {
      filter: drop-shadow(0 0 5px rgba(0, 229, 255, 0.3));
    }

    /* Texto de la tarjeta */
    .card span {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      flex-grow: 1;
    }

    /* Flecha sutil a la derecha */
    .card::after {
      content: '→';
      font-size: 1.1rem;
      color: rgba(255,255,255,0.2);
      transition: all 0.3s var(--ease);
    }

    .card:active::after {
      color: var(--accent);
      transform: translateX(3px);
    }

  </style>
</head>
<body>

  <h1>StreamHub Premium</h1>

    <div class="grid">
