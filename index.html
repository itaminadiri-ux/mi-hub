<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Hub de Contenido</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0d1424;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      color: #38bdf8;
      font-size: 1.6rem;
      margin-bottom: 25px;
      margin-top: 10px;
      text-align: center;
    }
    .section-title {
      align-self: flex-start;
      width: 100%;
      max-width: 500px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-top: 15px;
      margin-bottom: 15px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 5px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 10px;
    }
    .card {
      background-color: #1a2638;
      border: 1px solid #28374d;
      border-radius: 12px;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.2s, background-color 0.2s;
    }
    .card:active {
      transform: scale(0.96);
      background-color: #24344d;
    }
    .card .icon {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    .card span {
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Mi Hub de Contenido</h1>

  <!-- FÚTBOL Y DEPORTES -->
  <div class="section-title">FÚTBOL Y DEPORTES</div>
  <div class="grid">
    <!-- Botón directo a tu APK FCTV33 -->
    <a href="intent:#Intent;launchFlags=0x10000000;component=com.fctv77.app/com.rblive.launcher.splash.SplashActivity;end" class="card">
      <div class="icon">⚽</div>
      <span>FC TV 33 HD</span>
    </a>

    <a href="https://futbollibre.net/" target="_blank" class="card">
      <div class="icon">▶</div>
      <span>Fútbol Libre TV</span>
    </a>
  </div>

  <!-- CINE, SERIES Y ANIME -->
  <div class="section-title">CINE, SERIES Y ANIME</div>
  <div class="grid">
    <a href="https://pelisflix.top/" target="_blank" class="card">
      <div class="icon">🎬</div>
      <span>Pelisflix</span>
    </a>

    <a href="https://seriesflix.video/" target="_blank" class="card">
      <div class="icon">📺</div>
      <span>Seriesflix</span>
    </a>

    <a href="https://animeonline.ninja/" target="_blank" class="card">
      <div class="icon">▶</div>
      <span>Anime Online</span>
    </a>
  </div>

</body>
</html>
